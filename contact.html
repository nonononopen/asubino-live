    <header class="page-hero">
      <p class="ja-title">CONTACT</p>
      <h1>お問い合わせ</h1>
    </header>
    <section class="section">
      <p class="center" style="margin-top:-24px">
        ご予約・お問い合わせはお電話、または下記フォームから。<br />
        TEL. 0263-82-6419（9:00–21:00 年中無休）<br />
        Mail. azuminoconcert@gmail.com
      </p>
      <form class="form" style="margin-top:32px">
        <label>お問い合わせ種別
          <select name="type" required>
            <option value="">選択してください</option>
            <option>チケット予約</option>
            <option>ホール予約</option>
            <option>録音・レッスン</option>
            <option>その他</option>
          </select>
        </label>
        <label>お名前 <input name="name" required autocomplete="name" /></label>
        <label>メールアドレス <input type="email" name="email" required autocomplete="email" /></label>
        <label>電話番号 <input type="tel" name="tel" autocomplete="tel" /></label>
        <label>ご希望日時 <input name="date" placeholder="例）2026年9月13日 14:00" /></label>
        <label>内容 <textarea name="message" required></textarea></label>
        <p class="center"><button class="btn-line" type="submit">送信する</button></p>
      </form>
    </section>
    <div class="toast" role="status"></div>
